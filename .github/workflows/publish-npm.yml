name: Publish to npm

on:
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  test-node-support:
    name: Test supported Node.js versions
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/test-node.yml

  publish:
    name: Publish package
    if: github.ref == 'refs/heads/main'
    needs: test-node-support
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build and test
        run: |
          pnpm run build
          pnpm test

      - name: Inspect package
        run: npm pack --dry-run --ignore-scripts

      - name: Read package metadata
        id: package
        shell: bash
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Determine npm distribution tag
        id: npm-tag
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" == *-* ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release notes
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          node scripts/extract-release-notes.mjs "$PACKAGE_VERSION" > release-notes.md
          printf '\nPublished package: https://www.npmjs.com/package/%s/v/%s\n' \
            "$PACKAGE_NAME" "$PACKAGE_VERSION" >> release-notes.md

      - name: Check whether version is already published
        id: registry
        shell: bash
        run: |
          if npm view "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        if: steps.registry.outputs.exists != 'true'
        env:
          NPM_TAG: ${{ steps.npm-tag.outputs.tag }}
        run: npm publish --tag "$NPM_TAG" --provenance --access public

      - name: Create GitHub release with notes
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          tag="v${PACKAGE_VERSION}"
          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" \
                --title "$tag" \
                --notes-file release-notes.md \
                --prerelease
            else
              gh release create "$tag" \
                --target "$GITHUB_SHA" \
                --title "$tag" \
                --notes-file release-notes.md \
                --prerelease
            fi
          else
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" \
                --title "$tag" \
                --notes-file release-notes.md
            else
              gh release create "$tag" \
                --target "$GITHUB_SHA" \
                --title "$tag" \
                --notes-file release-notes.md
            fi
          fi
