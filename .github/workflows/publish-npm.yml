name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      npm_tag:
        description: npm distribution tag
        required: true
        default: beta
        type: choice
        options:
          - beta
          - latest

permissions:
  contents: write
  id-token: write

jobs:
  test-node-support:
    name: Test supported Node.js versions
    uses: ./.github/workflows/test-node.yml

  publish:
    name: Build, test and publish
    needs: test-node-support
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare release notes
        id: release
        run: |
          release_version="$(node -p "require('./package.json').version")"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          node scripts/extract-release-notes.mjs "$release_version" > release-notes.md

      - name: Publish package
        run: npm publish --access public --tag "${{ inputs.npm_tag }}" --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub prerelease
        if: inputs.npm_tag != 'latest'
        run: >-
          gh release create "v${{ steps.release.outputs.version }}"
          --title "v${{ steps.release.outputs.version }}"
          --notes-file release-notes.md
          --target "$GITHUB_SHA"
          --prerelease
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create GitHub release
        if: inputs.npm_tag == 'latest'
        run: >-
          gh release create "v${{ steps.release.outputs.version }}"
          --title "v${{ steps.release.outputs.version }}"
          --notes-file release-notes.md
          --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
